<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>jm-loc — location, canton de Genève</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --papier: #FAFAF7;
    --encre: #16191C;
    --gris: #6B7176;
    --gris-clair: #DADCDD;
    --leman: #1D4E6B;
    --leman-clair: #E7EEF1;
    --alerte: #A83B32;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--papier);
    color: var(--encre);
    font-family: "Neue Haas Grotesk Text Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font-family: inherit; }

  #haut {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--papier);
  }
  header {
    padding: 28px 20px 0;
    border-bottom: 1px solid var(--gris-clair);
  }
  .marque {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding-bottom: 16px;
  }
  .marque h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .marque h1 span { color: var(--leman); }
  .compteur {
    font-size: 13px;
    color: var(--gris);
    font-variant-numeric: tabular-nums;
  }

  .onglets {
    display: flex;
    gap: 4px;
  }
  .onglet {
    border: none;
    background: none;
    padding: 10px 4px;
    margin-right: 20px;
    font-size: 14px;
    color: var(--gris);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    position: relative;
    top: 1px;
  }
  .onglet.actif { color: var(--encre); border-bottom-color: var(--leman); font-weight: 600; }
  .onglet .n { color: var(--gris); font-weight: 400; font-variant-numeric: tabular-nums; }

  .filtres {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gris-clair);
    display: flex;
    flex-wrap: wrap;
    gap: 20px 28px;
    align-items: flex-end;
  }
  .champ {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .champ label {
    font-size: 11px;
    color: var(--gris);
    letter-spacing: 0.01em;
  }
  .champ input, .champ select {
    border: none;
    border-bottom: 1px solid var(--encre);
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--encre);
    padding: 3px 0;
    width: 110px;
    font-variant-numeric: tabular-nums;
  }
  .champ select { width: auto; padding-right: 4px; }
  .champ input:focus, .champ select:focus { outline: none; border-bottom: 2px solid var(--leman); }
  .champ.large input { width: 180px; }
  .reinit {
    border: none;
    background: none;
    color: var(--gris);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 0;
  }
  .reinit:hover { color: var(--encre); }

  .menu-communes { position: relative; }
  .menu-communes > button {
    border: none;
    border-bottom: 1px solid var(--encre);
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--encre);
    padding: 3px 0;
    cursor: pointer;
    text-align: left;
  }
  .panneau-communes {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 8px;
    background: var(--papier);
    border: 1px solid var(--gris-clair);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 10px;
    z-index: 10;
    width: 280px;
    max-height: 320px;
    overflow-y: auto;
    columns: 2;
    column-gap: 12px;
  }
  .panneau-communes.ouvert { display: block; }
  .panneau-communes label { display: block; font-size: 13px; padding: 3px 0; white-space: nowrap; cursor: pointer; }
  .panneau-communes label.exclue { color: var(--alerte); font-weight: 600; }
  .panneau-communes input { margin-right: 6px; }

  main { padding: 4px 20px 60px; }

  .ligne {
    display: grid;
    grid-template-columns: 92px 100px 110px 1fr auto;
    gap: 14px;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--gris-clair);
  }
  .ligne:hover { background: var(--leman-clair); margin: 0 -12px; padding: 14px 12px; }

  .loyer {
    font-weight: 700;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    color: var(--leman);
    white-space: nowrap;
  }
  .carac {
    font-size: 13px;
    color: var(--gris);
    white-space: nowrap;
  }
  .commune { font-size: 14px; }
  .contenu a {
    text-decoration: none;
    font-size: 14px;
  }
  .contenu a:hover { text-decoration: underline; }
  .source {
    display: block;
    font-size: 11px;
    color: var(--gris);
    margin-top: 2px;
  }
  .actions {
    display: flex;
    gap: 10px;
    white-space: nowrap;
  }
  .actions button {
    border: 1px solid var(--gris-clair);
    background: var(--papier);
    height: 30px;
    padding: 0 10px;
    font-size: 15px;
    cursor: pointer;
    color: var(--gris);
  }
  .actions button.icone { width: 30px; padding: 0; }
  .actions button:hover { border-color: var(--encre); color: var(--encre); }
  .actions button.actif { color: var(--leman); border-color: var(--leman); }
  .actions button.retirer:hover { color: var(--alerte); border-color: var(--alerte); }

  .vide {
    padding: 60px 0;
    text-align: center;
    color: var(--gris);
    font-size: 14px;
  }

  @media (max-width: 640px) {
    .ligne {
      grid-template-columns: 1fr auto;
      grid-template-areas: "loyer actions" "carac carac" "contenu contenu";
      row-gap: 4px;
    }
    .loyer { grid-area: loyer; }
    .actions { grid-area: actions; }
    .carac { grid-area: carac; }
    .commune { display: none; }
    .contenu { grid-area: contenu; }
    .panneau-communes { width: 220px; columns: 1; left: auto; right: 0; }
  }
</style>
</head>
<body>

<div id="haut">
<header>
  <div class="marque">
    <h1>jm<span>·</span>loc</h1>
    <div class="compteur" id="compteur">chargement…</div>
  </div>
  <div class="onglets">
    <button class="onglet actif" data-onglet="toutes">Toutes</button>
    <button class="onglet" data-onglet="retenues">Retenues <span class="n" id="n-retenues"></span></button>
    <button class="onglet" data-onglet="ecartees">Écartées <span class="n" id="n-ecartees"></span></button>
    <button class="onglet" id="bouton-espace" style="margin-left:auto">Espace ⚙</button>
    <button class="onglet" id="bouton-sources">Sources</button>
  </div>
</header>

<div class="filtres" id="barre-filtres">
  <div class="champ">
    <label for="f-loyer">Loyer max, CHF</label>
    <input id="f-loyer" type="number" inputmode="numeric" />
  </div>
  <div class="champ">
    <label for="f-pieces">Pièces min</label>
    <input id="f-pieces" type="number" inputmode="numeric" step="0.5" />
  </div>
  <div class="champ menu-communes">
    <label>Communes exclues</label>
    <button id="bouton-communes" type="button">Aucune</button>
    <div class="panneau-communes" id="panneau-communes"></div>
  </div>
  <div class="champ">
    <label for="f-tri">Trier par</label>
    <select id="f-tri">
      <option value="recent">Plus récentes</option>
      <option value="loyer-asc">Loyer croissant</option>
      <option value="loyer-desc">Loyer décroissant</option>
      <option value="m2-asc">Prix au m² croissant</option>
      <option value="m2-desc">Prix au m² décroissant</option>
      <option value="surface-asc">Surface croissante</option>
      <option value="surface-desc">Surface décroissante</option>
      <option value="pieces-asc">Pièces croissant</option>
      <option value="pieces-desc">Pièces décroissant</option>
    </select>
  </div>
  <button class="reinit" id="reinit">Réinitialiser</button>
</div>

<div class="filtres" id="panneau-espace" style="display:none">
  <div class="champ large" style="max-width:480px">
    <label>Espace personnel</label>
    <p style="font-size:13px;color:var(--gris);margin:2px 0 8px">
      Par défaut, tous les appareils partagent le même espace (« principal »).
      Pour que quelqu'un ait ses propres favoris et biens écartés, saisissez ici un nom au choix (p. ex. « conjoint ») sur son appareil.
    </p>
    <div style="font-family: ui-monospace, monospace; font-size:14px; margin-bottom:8px;" id="espace-actuel"></div>
    <input id="champ-espace" type="text" placeholder="rejoindre un autre espace" style="border:1px solid var(--gris-clair);padding:6px 8px;width:220px;font-family:inherit;font-size:14px;" />
    <button id="bouton-rejoindre" style="border:1px solid var(--encre);background:var(--papier);padding:6px 12px;font-size:14px;cursor:pointer;margin-left:6px;">Rejoindre</button>

    <!-- Alertes par e-mail : masquées tant que l'envoi n'est pas
         réellement fonctionnel (pas d'identifiants SMTP configurés).
         Backend prêt (préférences email/alertes_actives, route
         /api/alertes/verifier, workflow alertes.yml) — à réactiver ici
         une fois l'envoi effectif branché. -->
  </div>
</div>

<div class="filtres" id="panneau-sources" style="display:none">
  <div class="champ large" style="max-width:100%;width:100%">
    <label>Sources considérées</label>
    <p style="font-size:13px;color:var(--gris);margin:2px 0 8px" id="sources-resume"></p>
    <div class="champ" style="margin-bottom:10px">
      <label for="f-tri-sources">Trier par</label>
      <select id="f-tri-sources">
        <option value="statut">Statut</option>
        <option value="nom">Nom</option>
        <option value="annonces">Nombre d'annonces</option>
        <option value="verifie">Dernière vérification</option>
      </select>
    </div>
    <div id="liste-sources" style="max-height:420px;overflow-y:auto"></div>
  </div>
</div>
</div>

<main>
  <div id="liste"></div>
  <div class="vide" id="vide" style="display:none">Aucune annonce ne correspond à ces critères pour l'instant.</div>
</main>

<script>
var COMMUNES = [
  "Aire-la-Ville","Anières","Avully","Avusy","Bardonnex","Bellevue","Bernex","Carouge",
  "Cartigny","Céligny","Chancy","Chêne-Bougeries","Chêne-Bourg","Choulex","Collex-Bossy",
  "Collonge-Bellerive","Cologny","Confignon","Corsier","Dardagny","Genève","Genthod",
  "Le Grand-Saconnex","Gy","Hermance","Jussy","Laconnex","Lancy","Meinier","Meyrin","Onex",
  "Perly-Certoux","Plan-les-Ouates","Pregny-Chambésy","Presinge","Puplinge","Russin",
  "Satigny","Soral","Thônex","Troinex","Vandœuvres","Vernier","Versoix","Veyrier"
];

var etat = { biens: [], favoris: new Set(), discarded: new Set(), prefs: {}, communesExclues: new Set(), onglet: "toutes" };

function espaceLocal() {
  try {
    var e = localStorage.getItem("jm_espace");
    if (!e) {
      e = "principal";
      localStorage.setItem("jm_espace", e);
    }
    return e;
  } catch (err) { return "principal"; }
}

function definirEspace(e) {
  var propre = String(e || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);
  if (!propre) return false;
  try { localStorage.setItem("jm_espace", propre); } catch (err) {}
  return true;
}

async function api(chemin, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers || {}, { "X-Espace": espaceLocal() });
  var res = await fetch(chemin, options);
  return res.json();
}

function formatCHF(n) {
  if (n == null) return "prix sur demande";
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'") + ".–";
}

function construirePanneauCommunes() {
  var panneau = document.getElementById("panneau-communes");
  panneau.innerHTML = COMMUNES.map(function (c) {
    var exclue = etat.communesExclues.has(c);
    return '<label class="' + (exclue ? "exclue" : "") + '"><input type="checkbox" value="' + c + '" ' + (exclue ? "checked" : "") + '/> ' + c + '</label>';
  }).join("");
  panneau.querySelectorAll("input").forEach(function (cb) {
    cb.addEventListener("change", function () {
      if (cb.checked) etat.communesExclues.add(cb.value);
      else etat.communesExclues.delete(cb.value);
      cb.closest("label").classList.toggle("exclue", cb.checked);
      majBoutonCommunes();
      sauverPreferences();
      rendre();
    });
  });
}

function majBoutonCommunes() {
  var n = etat.communesExclues.size;
  document.getElementById("bouton-communes").textContent =
    n === 0 ? "Aucune" : n + " exclue" + (n > 1 ? "s" : "");
}

function trier(liste, mode) {
  var copie = liste.slice();
  function v(x, fallback) { return x == null ? fallback : x; }
  if (mode === "loyer-asc") return copie.sort(function (a, b) { return v(a.loyer_brut, Infinity) - v(b.loyer_brut, Infinity); });
  if (mode === "loyer-desc") return copie.sort(function (a, b) { return v(b.loyer_brut, -Infinity) - v(a.loyer_brut, -Infinity); });
  if (mode === "m2-asc") return copie.sort(function (a, b) { return v(a.loyer_m2, Infinity) - v(b.loyer_m2, Infinity); });
  if (mode === "m2-desc") return copie.sort(function (a, b) { return v(b.loyer_m2, -Infinity) - v(a.loyer_m2, -Infinity); });
  if (mode === "surface-asc") return copie.sort(function (a, b) { return v(a.surface, Infinity) - v(b.surface, Infinity); });
  if (mode === "surface-desc") return copie.sort(function (a, b) { return v(b.surface, -Infinity) - v(a.surface, -Infinity); });
  if (mode === "pieces-asc") return copie.sort(function (a, b) { return v(a.rooms, Infinity) - v(b.rooms, Infinity); });
  if (mode === "pieces-desc") return copie.sort(function (a, b) { return v(b.rooms, -Infinity) - v(a.rooms, -Infinity); });
  return copie;
}

function rendre() {
  var loyerMax = parseFloat(document.getElementById("f-loyer").value) || Infinity;
  var piecesMin = parseFloat(document.getElementById("f-pieces").value) || 0;
  var tri = document.getElementById("f-tri").value;
  var onglet = etat.onglet;

  document.getElementById("barre-filtres").style.display = onglet === "ecartees" ? "none" : "flex";

  var base = etat.biens;
  if (onglet === "toutes") {
    base = base.filter(function (b) { return !etat.discarded.has(b.bien_id) && !etat.favoris.has(b.bien_id); });
  } else if (onglet === "retenues") {
    base = base.filter(function (b) { return etat.favoris.has(b.bien_id); });
  } else if (onglet === "ecartees") {
    base = base.filter(function (b) { return etat.discarded.has(b.bien_id); });
  }

  var filtres = base;
  if (onglet !== "ecartees") {
    filtres = base.filter(function (b) {
      if (onglet === "toutes" && b.loyer_brut == null) return false;
      if (b.loyer_brut != null && b.loyer_brut > loyerMax) return false;
      if (b.rooms != null && b.rooms < piecesMin) return false;
      if (b.locality && etat.communesExclues.has(b.locality)) return false;
      return true;
    });
    filtres = trier(filtres, tri);
  }

  document.getElementById("n-retenues").textContent = "(" + etat.biens.filter(function (b) { return etat.favoris.has(b.bien_id); }).length + ")";
  document.getElementById("n-ecartees").textContent = "(" + etat.biens.filter(function (b) { return etat.discarded.has(b.bien_id); }).length + ")";
  document.getElementById("compteur").textContent = filtres.length + " annonce" + (filtres.length > 1 ? "s" : "");

  var liste = document.getElementById("liste");
  var vide = document.getElementById("vide");
  liste.innerHTML = "";

  if (filtres.length === 0) {
    vide.style.display = "block";
    vide.textContent = onglet === "ecartees"
      ? "Rien d'écarté pour l'instant."
      : onglet === "retenues"
      ? "Aucun favori pour l'instant — l'étoile sur une annonce l'ajoute ici."
      : "Aucune annonce ne correspond à ces critères pour l'instant.";
    return;
  }
  vide.style.display = "none";

  filtres.forEach(function (b) {
    var ligne = document.createElement("div");
    ligne.className = "ligne";
    var estFavori = etat.favoris.has(b.bien_id);

    var actionsHtml = onglet === "ecartees"
      ? '<button class="restaurer" data-id="' + b.bien_id + '">Restaurer</button>'
      : '<button class="icone favori ' + (estFavori ? "actif" : "") + '" title="Favori" data-id="' + b.bien_id + '">' + (estFavori ? "\u2605" : "\u2606") + '</button>' +
        '<button class="icone retirer" title="Ne plus voir" data-id="' + b.bien_id + '">\u2715</button>';

    ligne.innerHTML =
      '<div class="loyer">' + formatCHF(b.loyer_brut) + '</div>' +
      '<div class="carac">' + (b.rooms != null ? b.rooms + " p." : "—") + ' ' + (b.surface != null ? "· " + b.surface + " m²" : "") + '</div>' +
      '<div class="commune">' + (b.locality || "—") + '</div>' +
      '<div class="contenu">' +
        '<a href="' + (b.url || "#") + '" target="_blank" rel="noopener">' + (b.title || "Annonce sans titre") + '</a>' +
        '<span class="source">' + (b.locality ? b.locality + " · " : "") + (b.source || "") + '</span>' +
      '</div>' +
      '<div class="actions">' + actionsHtml + '</div>';
    liste.appendChild(ligne);
  });

  liste.querySelectorAll(".favori").forEach(function (btn) {
    btn.addEventListener("click", async function () {
      var id = btn.dataset.id;
      var estDeja = etat.favoris.has(id);
      if (estDeja) etat.favoris.delete(id); else etat.favoris.add(id);
      await api("/api/favoris", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ bien_id: id, retirer: estDeja }),
      });
      rendre();
    });
  });

  liste.querySelectorAll(".retirer").forEach(function (btn) {
    btn.addEventListener("click", async function () {
      var id = btn.dataset.id;
      etat.discarded.add(id);
      await api("/api/discarded", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ bien_id: id }),
      });
      rendre();
    });
  });

  liste.querySelectorAll(".restaurer").forEach(function (btn) {
    btn.addEventListener("click", async function () {
      var id = btn.dataset.id;
      etat.discarded.delete(id);
      await api("/api/discarded", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ bien_id: id, retirer: true }),
      });
      rendre();
    });
  });
}

async function sauverPreferences() {
  etat.prefs.loyer_max = parseFloat(document.getElementById("f-loyer").value) || null;
  etat.prefs.pieces_min = parseFloat(document.getElementById("f-pieces").value) || null;
  var corps = Object.assign({}, etat.prefs, { communes_exclues: Array.from(etat.communesExclues) });
  await api("/api/preferences", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(corps),
  });
}

async function init() {
  var espaceInitial = espaceLocal();
  var resultats = await Promise.all([
    api("/api/biens"), api("/api/favoris"), api("/api/discarded"), api("/api/preferences"),
  ]);
  etat.biens = resultats[0];
  etat.favoris = new Set(resultats[1]);
  etat.discarded = new Set(resultats[2]);
  etat.prefs = resultats[3];

  // Réparation : un appareil basculé par erreur vers un espace aléatoire
  // vide (avant ce correctif) est ramené silencieusement vers "principal".
  var ressembleAutoGenere = /^esp-[a-z0-9]+$/.test(espaceInitial);
  if (ressembleAutoGenere && etat.favoris.size === 0 && etat.discarded.size === 0 && !sessionStorage.getItem("jm_reparation_faite")) {
    sessionStorage.setItem("jm_reparation_faite", "1");
    definirEspace("principal");
    location.reload();
    return;
  }

  try {
    etat.communesExclues = new Set(JSON.parse(etat.prefs.communes_exclues_json || "[]"));
  } catch (e) { etat.communesExclues = new Set(); }

  document.getElementById("f-loyer").value = etat.prefs.loyer_max || "";
  document.getElementById("f-pieces").value = etat.prefs.pieces_min || "";

  construirePanneauCommunes();
  majBoutonCommunes();

  document.getElementById("f-loyer").addEventListener("input", rendre);
  document.getElementById("f-loyer").addEventListener("change", sauverPreferences);
  document.getElementById("f-pieces").addEventListener("input", rendre);
  document.getElementById("f-pieces").addEventListener("change", sauverPreferences);
  document.getElementById("f-tri").addEventListener("change", rendre);

  document.getElementById("bouton-communes").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("panneau-communes").classList.toggle("ouvert");
  });
  document.addEventListener("click", function () {
    document.getElementById("panneau-communes").classList.remove("ouvert");
  });
  document.getElementById("panneau-communes").addEventListener("click", function (e) { e.stopPropagation(); });

  document.getElementById("reinit").addEventListener("click", function () {
    document.getElementById("f-loyer").value = "";
    document.getElementById("f-pieces").value = "";
    document.getElementById("f-tri").value = "recent";
    etat.communesExclues.clear();
    construirePanneauCommunes();
    majBoutonCommunes();
    sauverPreferences();
    rendre();
  });

  document.getElementById("espace-actuel").textContent = espaceLocal();
  document.getElementById("bouton-espace").addEventListener("click", function () {
    var p = document.getElementById("panneau-espace");
    p.style.display = p.style.display === "none" ? "flex" : "none";
  });

  var sourcesChargees = null;
  function rendreSources() {
    if (!sourcesChargees) return;
    var tri = document.getElementById("f-tri-sources").value;
    var copie = sourcesChargees.slice();
    if (tri === "statut") {
      copie.sort(function (a, b) { return (a.state || "").localeCompare(b.state || "") || (a.name || "").localeCompare(b.name || ""); });
    } else if (tri === "nom") {
      copie.sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
    } else if (tri === "annonces") {
      copie.sort(function (a, b) { return (b.last_productive_count || 0) - (a.last_productive_count || 0); });
    } else if (tri === "verifie") {
      copie.sort(function (a, b) { return (b.last_checked || "").localeCompare(a.last_checked || ""); });
    }

    var actives = sourcesChargees.filter(function (s) { return s.enabled; }).length;
    document.getElementById("sources-resume").textContent =
      sourcesChargees.length + " source(s) considérée(s), dont " + actives + " active(s) en collecte.";

    var liste = document.getElementById("liste-sources");
    liste.innerHTML = copie.map(function (s) {
      var couleur = s.state === "productive" ? "var(--leman)" : (s.enabled ? "var(--encre)" : "var(--gris)");
      var verifie = s.last_checked ? new Date(s.last_checked).toLocaleString("fr-CH") : "jamais";
      return '<div style="padding:8px 0;border-bottom:1px solid var(--gris-clair);font-size:13px">' +
        '<div style="display:flex;justify-content:space-between;gap:8px">' +
          '<strong>' + (s.name || "") + '</strong>' +
          '<span style="color:' + couleur + '">' + (s.state || "—") + (s.enabled ? "" : " · désactivée") + '</span>' +
        '</div>' +
        '<div style="color:var(--gris)">' + (s.last_productive_count || 0) + ' annonce(s) · vérifiée ' + verifie + '</div>' +
      '</div>';
    }).join("");
  }

  document.getElementById("bouton-sources").addEventListener("click", async function () {
    var p = document.getElementById("panneau-sources");
    var ouvrir = p.style.display === "none";
    p.style.display = ouvrir ? "flex" : "none";
    if (ouvrir && !sourcesChargees) {
      sourcesChargees = await api("/api/sources");
      rendreSources();
    }
  });
  document.getElementById("f-tri-sources").addEventListener("change", rendreSources);
  document.getElementById("bouton-rejoindre").addEventListener("click", function () {
    var champ = document.getElementById("champ-espace");
    if (definirEspace(champ.value)) {
      location.reload();
    } else {
      champ.style.borderColor = "var(--alerte)";
    }
  });

  document.querySelectorAll(".onglet[data-onglet]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".onglet").forEach(function (b) { b.classList.remove("actif"); });
      btn.classList.add("actif");
      etat.onglet = btn.dataset.onglet;
      rendre();
    });
  });

  rendre();
}

init();
</script>

</body>
</html>
