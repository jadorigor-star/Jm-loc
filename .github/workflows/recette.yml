name: recette

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

jobs:
  recette:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le dernier commit est bien celui qui est en ligne
        run: |
          mkdir -p diagnostics
          echo "commit repo (HEAD) : ${{ github.sha }}" > diagnostics/last-recette.md

      - name: /api/health répond
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://jm-loc.jadorigor.workers.dev/api/health")
          echo "health: $code $(cat /tmp/health.json)" >> diagnostics/last-recette.md
          [ "$code" = "200" ] || { echo "ÉCHEC /api/health"; exit 1; }

      - name: /api/preferences répond
        run: |
          code=$(curl -s -o /tmp/prefs.json -w "%{http_code}" "https://jm-loc.jadorigor.workers.dev/api/preferences")
          echo "preferences: $code $(cat /tmp/prefs.json)" >> diagnostics/last-recette.md
          [ "$code" = "200" ] || { echo "ÉCHEC /api/preferences"; exit 1; }

      - name: /api/stats répond
        run: |
          code=$(curl -s -o /tmp/stats.json -w "%{http_code}" "https://jm-loc.jadorigor.workers.dev/api/stats")
          echo "stats: $code $(cat /tmp/stats.json)" >> diagnostics/last-recette.md
          [ "$code" = "200" ] || { echo "ÉCHEC /api/stats"; exit 1; }

      - name: Committer le diagnostic
        if: always()
        run: |
          git config user.name "jm-loc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/last-recette.md
          git diff --staged --quiet || git commit -m "diagnostic: recette $(date -u +%FT%TZ)"
          git push
