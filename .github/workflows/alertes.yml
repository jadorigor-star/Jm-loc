name: alertes

on:
  # Planification désactivée tant que l'envoi d'e-mail n'est pas configuré
  # (des identifiants SMTP manquent) — sans quoi les biens seraient marqués
  # "déjà notifiés" en silence, et ne seraient plus jamais signalés une
  # fois l'envoi réellement branché.
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les nouveaux biens correspondants
        id: verif
        run: |
          curl -s -X POST "https://jm-loc.jadorigor.workers.dev/api/alertes/verifier" > /tmp/alertes.json
          mkdir -p diagnostics
          cp /tmp/alertes.json diagnostics/last-alertes.json
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/alertes.json','utf8')).length)")
          echo "nb_espaces_a_notifier=$count" >> "$GITHUB_OUTPUT"

      # --- Envoi par e-mail : NÉCESSITE des identifiants SMTP en secrets
      # (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS) — non configurés pour
      # l'instant. Tant qu'ils ne le sont pas, cette étape ne fait rien.
      - name: Envoyer les e-mails
        if: steps.verif.outputs.nb_espaces_a_notifier != '0'
        run: |
          node -e '
          const alertes = JSON.parse(require("fs").readFileSync("/tmp/alertes.json","utf8"));
          for (const a of alertes) {
            console.log("À envoyer à " + a.email + " : " + a.nouveaux.length + " nouveau(x) bien(s)");
          }
          '
          echo "Identifiants SMTP non configurés — voir diagnostics/last-alertes.json pour ce qui aurait été envoyé."

      - name: Committer le diagnostic
        run: |
          git config user.name "jm-loc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/last-alertes.json
          git diff --staged --quiet || git commit -m "diagnostic: alertes $(date -u +%FT%TZ)"
          git push
