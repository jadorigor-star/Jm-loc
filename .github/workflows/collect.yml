name: collect

on:
  schedule:
    # Toutes les heures — réduit depuis 20 minutes pour ménager le quota D1
    # partagé avec les autres projets. Pas de Cron Triggers Cloudflare
    # (défaut connu : arrêt silencieux).
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Collecter les sources actives
        run: node scripts/collect.js
        env:
          WORKER_URL: https://jm-loc.jadorigor.workers.dev

      - name: Committer le diagnostic
        run: |
          git config user.name "jm-loc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/last-collect.md
          git diff --staged --quiet || git commit -m "diagnostic: collecte $(date -u +%FT%TZ)"
          git push
