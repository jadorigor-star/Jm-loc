name: collect

on:
  # Planification suspendue temporairement : le quota gratuit de lecture D1
  # est épuisé pour la journée (cf. section 7 de l'amorçage), donc chaque
  # tentative échoue et déclenche un e-mail d'échec toutes les 20 minutes.
  # À réactiver après minuit UTC, une fois le quota reconstitué.
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Collecter les sources actives
        run: node scripts/collect.js
        env:
          WORKER_URL: https://jm-loc.jadorigor.workers.dev

      - name: Committer le diagnostic
        run: |
          git config user.name "jm-loc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/last-collect.md
          git diff --staged --quiet || git commit -m "diagnostic: collecte $(date -u +%FT%TZ)"
          git push
