name: admin

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Route à appeler (ex: /api/reprocess)"
        required: true
      body:
        description: "Corps JSON à envoyer"
        required: false
        default: "{}"

jobs:
  appel:
    runs-on: ubuntu-latest
    steps:
      - name: Appel
        run: |
          mkdir -p diagnostics
          curl -s -X POST "https://jm-loc.jadorigor.workers.dev${{ github.event.inputs.route }}" \
            -H "content-type: application/json" \
            -d '${{ github.event.inputs.body }}' > diagnostics/admin-result.json
      - name: Committer
        run: |
          git config user.name "jm-loc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/admin-result.json
          git commit -m "admin: ${{ github.event.inputs.route }}" || echo "rien"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
