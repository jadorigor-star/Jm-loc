name: admin

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Route à appeler (ex: /api/reprocess)"
        required: true
      body:
        description: "Corps JSON à envoyer"
        required: false
        default: "{}"

jobs:
  appel:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appel et publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPONSE=$(curl -s -X POST "https://jm-loc.jm-loco.workers.dev${{ github.event.inputs.route }}" \
            -H "content-type: application/json" \
            -d '${{ github.event.inputs.body }}')
          gh issue create --title "admin: ${{ github.event.inputs.route }}" --body "$REPONSE" --repo jadorigor-star/Jm-loc
